<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="gcBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="gcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10B981" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Badge A -->
  <g filter="url(#gcGlow)">
    <rect x="8" y="8" width="64" height="64" rx="16" fill="url(#gcBadgeGrad)" />
    <rect x="8.5" y="8.5" width="63" height="63" rx="15.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="40" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" fill="#052014" text-anchor="middle" dominant-baseline="central">A</text>
  </g>

  <!-- Wordmark -->
  <text x="90" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-1.2">
    <tspan fill="#FFFFFF">Green</tspan><tspan fill="#34D399">Code</tspan>
  </text>
</svg>
